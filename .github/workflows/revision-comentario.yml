# Publica en el PR el resultado de revision.yml.
#
# Va aparte porque los PR de bifurcaciones no pueden comentar con su propio token. Este
# workflow corre con el código de main (no el del PR): solo lee el artefacto, busca la
# preview de Vercel y crea o actualiza un único comentario. No usa secretos.
name: Comentario de la revisión

on:
  workflow_run:
    workflows: ['Revisión de componentes']
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comentar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: revision
          path: revision
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const MARKER = '<!-- angela:revision -->';

            // El PR sale del commit revisado (dato de GitHub), no del artefacto.
            let number = run.pull_requests?.[0]?.number;
            if (!number) {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              number = open.find((pr) => pr.head.sha === run.head_sha)?.number;
            }
            if (!number) return core.notice(`No hay un PR abierto para ${run.head_sha}.`);

            let body = fs.readFileSync('revision/comentario.md', 'utf8').slice(0, 60000);
            if (!body.startsWith(MARKER)) return core.setFailed('El artefacto no tiene el formato esperado.');

            // La preview de Vercel: el enlace de su comentario, cuando el despliegue está listo.
            if (body.includes('{{preview}}')) {
              let preview = null;
              for (let i = 0; i < 30 && !preview; i++) {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
                const vercel = comments.find((c) => c.user?.login?.startsWith('vercel') && /Ready/.test(c.body ?? ''));
                preview = vercel?.body.match(/https:\/\/[a-z0-9-]+\.vercel\.app/)?.[0] ?? null;
                if (!preview) await new Promise((r) => setTimeout(r, 10000));
              }
              body = preview
                ? body.replaceAll('{{preview}}', preview)
                : body
                    .replaceAll('[ver]({{preview}}', '[ver](#')
                    .replace('### Revisión visual', '### Revisión visual\n\n_La preview de Vercel aún no estaba lista: usa el enlace de su comentario._');
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const previo = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
