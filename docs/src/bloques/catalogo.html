<div class="stack" style="--stack-gap: var(--space-6)">
  <div class="cluster" style="justify-content: space-between">
    <h3 class="heading" data-size="2xl">Tecnología</h3>
    <p class="text" data-muted>4 productos · envío gratis desde 30 €</p>
  </div>
  <div class="cards" style="--cards-min: 14rem; --cards-gap: var(--space-4)">
    <article class="card card-3d stack" style="--stack-gap: var(--space-2)" aria-labelledby="b-prod-portatil">
      <img src="/img/tecnologia/portatil.webp" alt="" width="720" height="480" loading="lazy">
      <h4 class="heading" data-size="lg" id="b-prod-portatil">Portátil</h4>
      <p class="text" data-size="sm" data-muted>Potencia para crear, en 1,3 kg.</p>
      <p class="text" data-size="2xl" data-weight="bold" data-numeric>1.299 €</p>
      <div class="cluster card-3d-actions">
        <button class="button" type="button" data-variant="soft" aria-describedby="b-prod-portatil">Añadir al carrito</button>
      </div>
    </article>
    <article class="card card-3d stack" style="--stack-gap: var(--space-2)" aria-labelledby="b-prod-auriculares">
      <img src="/img/productos/auriculares.webp" alt="" width="720" height="480" loading="lazy">
      <h4 class="heading" data-size="lg" id="b-prod-auriculares">Auriculares</h4>
      <p class="text" data-size="sm" data-muted>Sonido sin distracciones.</p>
      <p class="text" data-size="2xl" data-weight="bold" data-numeric>249 €</p>
      <div class="cluster card-3d-actions">
        <button class="button" type="button" data-variant="soft" aria-describedby="b-prod-auriculares">Añadir al carrito</button>
      </div>
    </article>
    <article class="card card-3d stack" style="--stack-gap: var(--space-2)" aria-labelledby="b-prod-camara">
      <img src="/img/productos/camara-compacta.webp" alt="" width="720" height="480" loading="lazy">
      <h4 class="heading" data-size="lg" id="b-prod-camara">Cámara compacta</h4>
      <p class="text" data-size="sm" data-muted>Captura cada detalle.</p>
      <p class="text" data-size="2xl" data-weight="bold" data-numeric>649 €</p>
      <div class="cluster card-3d-actions">
        <button class="button" type="button" data-variant="soft" aria-describedby="b-prod-camara">Añadir al carrito</button>
      </div>
    </article>
    <article class="card card-3d stack" style="--stack-gap: var(--space-2)" aria-labelledby="b-prod-reloj">
      <img src="/img/productos/reloj-inteligente.webp" alt="" width="720" height="480" loading="lazy">
      <h4 class="heading" data-size="lg" id="b-prod-reloj">Reloj inteligente</h4>
      <p class="text" data-size="sm" data-muted>Tu día, de un vistazo.</p>
      <p class="text" data-size="2xl" data-weight="bold" data-numeric>329 €</p>
      <div class="cluster card-3d-actions">
        <button class="button" type="button" data-variant="soft" aria-describedby="b-prod-reloj">Añadir al carrito</button>
      </div>
    </article>
  </div>
</div>
