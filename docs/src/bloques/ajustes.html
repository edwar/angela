<dialog class="dialog" id="b-ajustes" aria-labelledby="b-ajustes-titulo" closedby="any">
  <form class="dialog-form" method="dialog">
    <header class="dialog-header">
      <h2 id="b-ajustes-titulo">Ajustes</h2>
      <button class="button" type="button" data-variant="ghost" data-tone="neutral" data-icon-only commandfor="b-ajustes" command="close" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </header>
    <div class="dialog-body stack">
      <div class="field">
        <label for="b-ajustes-nombre">Nombre visible</label>
        <input class="input" id="b-ajustes-nombre" name="nombre" value="Ana García" autocomplete="name">
      </div>
      <div class="field">
        <label for="b-ajustes-idioma">Idioma</label>
        <select class="input" id="b-ajustes-idioma" name="idioma">
          <option value="es" selected>Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
        </select>
      </div>
      <fieldset class="fieldset">
        <legend>Avisarme por</legend>
        <div class="choice">
          <input type="checkbox" role="switch" switch id="b-ajustes-correo" name="avisos-correo" checked>
          <label for="b-ajustes-correo">Correo</label>
        </div>
        <div class="choice">
          <input type="checkbox" role="switch" switch id="b-ajustes-movil" name="avisos-movil">
          <label for="b-ajustes-movil">Notificaciones en el móvil</label>
        </div>
      </fieldset>
      <fieldset class="fieldset">
        <legend>Densidad</legend>
        <div class="choice">
          <input type="radio" id="b-ajustes-comoda" name="densidad" value="comoda" checked>
          <label for="b-ajustes-comoda">Cómoda</label>
        </div>
        <div class="choice">
          <input type="radio" id="b-ajustes-compacta" name="densidad" value="compacta">
          <label for="b-ajustes-compacta">Compacta</label>
        </div>
      </fieldset>
    </div>
    <footer class="dialog-footer">
      <button class="button" type="button" data-variant="ghost" data-tone="neutral" commandfor="b-ajustes" command="close">Cancelar</button>
      <button class="button" type="submit">Guardar</button>
    </footer>
  </form>
</dialog>
